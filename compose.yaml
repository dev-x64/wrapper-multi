services:
  wrapper:
    build: .
    # The Android NDK toolchain is x86_64-only.
    platform: linux/amd64
    volumes:
      - ./rootfs/data:/app/rootfs/data
    ports:
      - "12340:12340"
    environment:
      WRAPPER_API_TOKEN: ${WRAPPER_API_TOKEN:-}
      # Public mode (anyone may add their own account); needs the token.
      WRAPPER_PUBLIC: ${WRAPPER_PUBLIC:-false}
    # lite is started in a user namespace + chroot.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
